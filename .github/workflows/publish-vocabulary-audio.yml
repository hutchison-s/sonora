name: Publish vocabulary audio batch
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Maximum new recordings in this batch'
        required: true
        default: '20'
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate recordings
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MONICA_VOICE_ID: rLNAvPlbeeD0hXimOh7A
          GEORGE_VOICE_ID: 7GCLDRn3tm42Ra1CZCPL
        run: npm run narrate:vocabulary -- --batch-size=${{ inputs.batch_size }}
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/vocabulary
          if ! git diff --cached --quiet; then
            git commit -m "Add standalone vocabulary audio batch"
            git push
          fi
